<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spring Boot DOM XSS Demo</title>
</head>
<body>
<h1>Hello <span th:utext="${name}"></span>!</h1>
<p>This page intentionally keeps unsafe rendering so the XSS example can be reproduced.</p>
<script th:inline="javascript">
    /*<![CDATA[*/
    var name = /*[(${name})]*/ 'default';
    document.write('<p>Welcome ' + name + '!</p>');
    /*]]>*/
</script>
</body>
</html>
