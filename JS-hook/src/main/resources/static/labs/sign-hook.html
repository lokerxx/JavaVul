<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Sign Hook</title>
    <style>
        body{font-family:Inter,system-ui,sans-serif;background:#020617;color:#e2e8f0;margin:0}
        .wrap{max-width:1100px;margin:0 auto;padding:24px}.card{background:#0f172a;border:1px solid #334155;border-radius:18px;padding:20px;margin-bottom:18px}
        pre,input{background:#111827;color:#e2e8f0;border:1px solid #334155;border-radius:12px;padding:12px;width:100%;box-sizing:border-box}
        button{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 14px}.ok{color:#22c55e}.bad{color:#f87171}
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>Request Sign Hook</h1>
        <p>目标：找出最终签名结果。提示：真实场景里一般会 Hook <code>fetch</code> / <code>XMLHttpRequest</code>，这里先手动跟踪参数拼接。</p>
    </div>
    <div class="card">
<pre>const input = {user:'alice', ts:'1710000000', nonce:'xyz'};
function sign(v){
  return btoa([v.user, v.ts, v.nonce, 'secret'].join('|'));
}
console.log(sign(input));</pre>
        <input id="answer" placeholder="提交签名值">
        <div style="margin-top:12px"><button onclick="check()">校验</button> <span id="result"></span></div>
    </div>
</div>
<script>
function check(){
  const ok = document.getElementById('answer').value.trim() === 'YWxpY2V8MTcxMDAwMDAwMHx4eXp8c2VjcmV0';
  document.getElementById('result').textContent = ok ? '回答正确' : '继续跟踪 sign() 输入和拼接顺序';
  document.getElementById('result').className = ok ? 'ok' : 'bad';
}
</script>
</body>
</html>
