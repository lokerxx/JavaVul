<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Array Restore</title>
    <style>
        body{font-family:Inter,system-ui,sans-serif;background:#020617;color:#e2e8f0;margin:0}
        .wrap{max-width:1100px;margin:0 auto;padding:24px}.card{background:#0f172a;border:1px solid #334155;border-radius:18px;padding:20px;margin-bottom:18px}
        pre,input{background:#111827;color:#e2e8f0;border:1px solid #334155;border-radius:12px;padding:12px;width:100%;box-sizing:border-box}
        button{background:#2563eb;color:#fff;border:none;border-radius:10px;padding:10px 14px}.ok{color:#22c55e}.bad{color:#f87171}
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>String Array Restore</h1>
        <p>目标：恢复最终拼接出的 secret。推荐做法：手动还原数组索引，或者写一个小脚本替换 <code>_0x()</code>。</p>
    </div>
    <div class="card">
<pre>const _arr = ['FLAG', 'alpha', 'restore', 'JS', '777', 'HOOK'];
function _0x(i){ return _arr[i - 0x10]; }
const result = [_0x(0x10), _0x(0x15), _0x(0x13), _0x(0x14)].join('-');
console.log(result);</pre>
        <input id="answer" placeholder="提交最终输出">
        <div style="margin-top:12px"><button onclick="check()">校验</button> <span id="result"></span></div>
    </div>
</div>
<script>
function check(){
  const ok = document.getElementById('answer').value.trim() === 'FLAG-HOOK-JS-777';
  document.getElementById('result').textContent = ok ? '回答正确' : '索引映射还没完全还原';
  document.getElementById('result').className = ok ? 'ok' : 'bad';
}
</script>
</body>
</html>
