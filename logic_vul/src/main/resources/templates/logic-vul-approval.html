<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>审批流跳步场景</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #0f172a; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
        .card { background: #fff; border-radius: 18px; box-shadow: 0 12px 32px rgba(15,23,42,.08); padding: 24px; margin-bottom: 18px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        input, textarea { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #cbd5e1; border-radius: 12px; margin-bottom: 12px; }
        textarea { min-height: 160px; }
        button, a.button { display: inline-block; margin-right: 10px; margin-top: 12px; border: 0; border-radius: 999px; background: #14532d; color: #fff; padding: 10px 16px; cursor: pointer; text-decoration: none; }
        a.button.secondary, button.secondary { background: #475569; }
        pre { background: #0f172a; color: #e2e8f0; padding: 16px; border-radius: 14px; min-height: 220px; overflow: auto; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1>审批流跳步场景</h1>
        <p>漏洞版允许客户端直接指定目标审批状态，例如直接改成 <code>APPROVED</code>；安全版根据当前状态、角色和动作推进流程。</p>
        <a class="button secondary" href="/logic-vul">返回首页</a>
    </div>
    <div class="grid">
        <div class="card">
            <h2>漏洞版</h2>
            <input id="approvalTaskId" value="9001">
            <textarea id="approvalVulBody">{ "actingUserId": 27, "targetStatus": "APPROVED", "comment": "skip all steps" }</textarea>
            <button onclick="postApproval('/workflow/approval/' + document.getElementById('approvalTaskId').value + '/vul', 'approvalVulBody')">执行漏洞版</button>
        </div>
        <div class="card">
            <h2>安全版</h2>
            <input id="approvalToken" placeholder="先获取 token">
            <textarea id="approvalSafeBody">{ "action": "SUBMIT", "comment": "submit for manager review" }</textarea>
            <button onclick="getApprovalToken()">获取普通用户 token</button>
            <button class="secondary" onclick="postApprovalWithToken('/workflow/approval/' + document.getElementById('approvalTaskId').value + '/safe', 'approvalSafeBody', 'approvalToken')">执行安全版</button>
        </div>
    </div>
    <div class="card"><h2>响应结果</h2><pre id="result">等待发送请求...</pre></div>
</div>
<script>
    async function getApprovalToken() {
        const response = await fetch('/auth/login-safe', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: 'frances.goldner', password: '3jwl2i3t6' }) });
        const data = await response.json();
        document.getElementById('approvalToken').value = data.token || '';
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
    async function postApproval(url, id) {
        const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: document.getElementById(id).value });
        document.getElementById('result').textContent = 'HTTP ' + response.status + '\n' + await response.text();
    }
    async function postApprovalWithToken(url, id, tokenId) {
        const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Logic-Token': document.getElementById(tokenId).value }, body: document.getElementById(id).value });
        document.getElementById('result').textContent = 'HTTP ' + response.status + '\n' + await response.text();
    }
</script>
</body>
</html>
