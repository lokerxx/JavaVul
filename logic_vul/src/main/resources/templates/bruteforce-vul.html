<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>弱口令登录爆破场景</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #f8fafc, #e2e8f0); color: #0f172a; }
        .page { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
        .card { background: #fff; border-radius: 18px; box-shadow: 0 12px 32px rgba(15,23,42,.08); padding: 24px; margin-bottom: 18px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; }
        input { width: 100%; box-sizing: border-box; padding: 12px 14px; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 12px; }
        button, a.button { display: inline-block; border: 0; border-radius: 999px; background: #7c2d12; color: #fff; padding: 10px 18px; cursor: pointer; text-decoration: none; }
        a.button.secondary, button.secondary { background: #475569; }
        pre { margin: 0; background: #0f172a; color: #e2e8f0; padding: 16px; border-radius: 14px; overflow: auto; min-height: 220px; }
        ul { padding-left: 20px; }
        .tip { color: #7c2d12; font-weight: 700; }
        code { background: #eef2ff; padding: 2px 6px; border-radius: 6px; }
    </style>
</head>
<body>
<div class="page">
    <div class="card">
        <h1>弱口令登录爆破场景</h1>
        <p>这个页面使用 SQLite 中的 <code>brute_force_users</code> 表，故意保留弱口令、用户名枚举和无限重试，适合演示登录爆破。</p>
        <a class="button secondary" href="/logic-vul">返回 logic_vul 首页</a>
    </div>
    <div class="grid">
        <div class="card">
            <h2>漏洞版登录</h2>
            <form id="loginForm">
                <label for="username">用户名</label>
                <input id="username" name="username" value="admin" autocomplete="off">
                <label for="password">密码</label>
                <input id="password" name="password" type="password" value="admin123" autocomplete="off">
                <button type="submit">提交登录</button>
            </form>
            <p class="tip">特点：服务端会区分“用户名不存在”和“密码错误”，也没有验证码与锁定。</p>
        </div>
        <div class="card">
            <h2>弱口令提示</h2>
            <ul id="hintUsers"><li>加载中...</li></ul>
            <p><strong>常见字典：</strong> <span id="dictionary">加载中...</span></p>
            <p><strong>说明：</strong> <span id="warning">加载中...</span></p>
        </div>
    </div>
    <div class="card">
        <h2>响应结果</h2>
        <pre id="result">等待提交登录...</pre>
    </div>
</div>
<script>
    async function loadHints() {
        const response = await fetch('/auth/bruteforce-vul/hints');
        const data = await response.json();
        const hintUsers = document.getElementById('hintUsers');
        hintUsers.innerHTML = '';
        data.usernames.forEach(function (item) {
            const li = document.createElement('li');
            li.textContent = item.username + ' / ' + item.displayName + ' / ' + item.role;
            hintUsers.appendChild(li);
        });
        document.getElementById('dictionary').textContent = data.dictionary;
        document.getElementById('warning').textContent = data.warning + '；' + data.storage;
    }

    document.getElementById('loginForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        const body = new URLSearchParams(new FormData(event.target));
        const response = await fetch('/auth/bruteforce-vul/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: body.toString()
        });
        const data = await response.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    });

    loadHints();
</script>
</body>
</html>
