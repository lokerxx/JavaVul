<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图形验证码登录场景</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #eff6ff, #dbeafe); color: #0f172a; }
        .page { max-width: 1100px; margin: 0 auto; padding: 32px 20px 48px; }
        .card { background: #fff; border-radius: 18px; box-shadow: 0 12px 32px rgba(15,23,42,.08); padding: 24px; margin-bottom: 18px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; }
        input { width: 100%; box-sizing: border-box; padding: 12px 14px; margin-bottom: 14px; border: 1px solid #cbd5e1; border-radius: 12px; }
        button, a.button { display: inline-block; border: 0; border-radius: 999px; background: #1d4ed8; color: #fff; padding: 10px 18px; cursor: pointer; text-decoration: none; }
        button.secondary, a.button.secondary { background: #475569; }
        .captcha-row { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
        .captcha-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 14px; padding: 6px 8px; }
        img { width: 180px; height: 64px; display: block; }
        pre { margin: 0; background: #0f172a; color: #e2e8f0; padding: 16px; border-radius: 14px; overflow: auto; min-height: 220px; }
        ul { padding-left: 20px; }
        code { background: #dbeafe; padding: 2px 6px; border-radius: 6px; }
    </style>
</head>
<body>
<div class="page">
    <div class="card">
        <h1>图形验证码登录场景</h1>
        <p>安全版要求每次登录都提交数字字母混合的图形验证码；验证码单次有效，失败达到阈值后会临时锁定账号。</p>
        <a class="button secondary" href="/logic-vul">返回 logic_vul 首页</a>
    </div>
    <div class="grid">
        <div class="card">
            <h2>安全版登录</h2>
            <form id="safeLoginForm">
                <label for="safeUsername">用户名</label>
                <input id="safeUsername" name="username" value="admin" autocomplete="off">
                <label for="safePassword">密码</label>
                <input id="safePassword" name="password" type="password" value="admin123" autocomplete="off">
                <div class="captcha-row">
                    <div class="captcha-box"><img id="captchaImage" alt="验证码图片"></div>
                    <button class="secondary" type="button" id="refreshCaptcha">刷新验证码</button>
                </div>
                <label for="captchaCode">验证码</label>
                <input id="captchaCode" name="captchaCode" placeholder="请输入图片中的数字或字母" autocomplete="off">
                <input id="captchaToken" name="captchaToken" type="hidden">
                <button type="submit">提交登录</button>
            </form>
        </div>
        <div class="card">
            <h2>防护说明</h2>
            <ul>
                <li>验证码由数字和大小写字母组成。</li>
                <li>验证码约 2 分钟失效，且每次校验后立即作废。</li>
                <li>服务端统一返回“用户名、密码或验证码错误”。</li>
                <li>同一账号连续失败 5 次后会临时锁定 60 秒。</li>
            </ul>
        </div>
    </div>
    <div class="card">
        <h2>响应结果</h2>
        <pre id="safeResult">等待提交登录...</pre>
    </div>
</div>
<script>
    async function refreshCaptcha() {
        const response = await fetch('/auth/bruteforce-safe/captcha/new');
        const data = await response.json();
        document.getElementById('captchaToken').value = data.captchaToken;
        document.getElementById('captchaImage').src = data.imageUrl + '&t=' + Date.now();
    }

    document.getElementById('refreshCaptcha').addEventListener('click', refreshCaptcha);

    document.getElementById('safeLoginForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        const body = new URLSearchParams(new FormData(event.target));
        const response = await fetch('/auth/bruteforce-safe/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
            body: body.toString()
        });
        const data = await response.json();
        document.getElementById('safeResult').textContent = JSON.stringify(data, null, 2);
        document.getElementById('captchaCode').value = '';
        await refreshCaptcha();
    });

    refreshCaptcha();
</script>
</body>
</html>
